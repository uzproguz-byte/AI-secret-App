<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Study Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="brand"><div class="mark">AI</div><div><h1>Study Assistant</h1><p>Screen → answer</p></div></div>
    <p class="intro">Open a small assistant window, share a tab or screen, then analyze what you see.</p>
    <button id="open" class="primary">Open screen assistant <span>↗</span></button>
    <p class="privacy">🔒 Screen access requires your permission. A still image is sent to your AI backend only when you analyze.</p>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
