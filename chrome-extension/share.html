<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Answer</title>
  <link rel="stylesheet" href="share.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <strong>AI Answer</strong>
      <span id="liveBadge" class="badge">Not sharing</span>
    </header>

    <video id="preview" class="capture-video" autoplay muted playsinline></video>

    <button id="mainAction" class="primary">Share screen</button>
    <p id="status" class="status" role="status">Share your screen to get started.</p>

    <section class="answer-card">
      <h2>Answer</h2>
      <div id="answer" class="answer empty">Your answer will appear here.</div>
    </section>
  </main>
  <script src="share.js"></script>
</body>
</html>
